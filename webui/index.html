<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>scholar.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/app.css?v=1781603152" />
</head>
<body>

<div id="gate" class="gate hidden">
  <h1 class="serif">scholar<span class="accent">.</span></h1>
  <p class="muted">enter your API key</p>
  <input id="gate-key" type="password" placeholder="hive_..." />
  <button class="primary" id="gate-go">enter</button>
  <p class="muted small">mint one: <code>POST /auth/keys</code> (see /docs)</p>
</div>

<div id="app" class="app hidden">

  <nav class="rail">
    <div class="rail-logo serif">s<span class="accent">.</span></div>
    <button class="rail-btn active" data-view="home" title="Home">⌂</button>
    <button class="rail-btn" data-view="insights" title="Cushion &amp; Analytics (phase 5)">◐</button>
    <button class="rail-btn" data-view="courses" title="Courses">❏</button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="btn-theme" title="Toggle light / dark">☽</button>
    <button class="rail-btn" id="btn-settings" title="Settings">⚙</button>
  </nav>

  <button class="collapse-tab" id="collapse-left" title="hide sidebar">‹</button>
    <aside class="sidebar" id="sidebar">
    <div class="side-section">
      <div class="side-head"><span>Courses</span>
        <button class="link-btn" id="btn-add-course">+ add</button></div>
      <div id="course-list"></div>
    </div>
    <div class="side-section">
      <div class="side-head"><span>Activities</span>
        <button class="link-btn" id="btn-add-activity">+ add</button></div>
      <div id="activity-list"></div>
    </div>
    <div class="side-section">
      <div class="side-head"><span>Canvas</span>
        <button class="link-btn" id="btn-canvas-cfg">configure</button></div>
      <div id="canvas-status" class="muted small">not configured</div>
      <button id="btn-canvas-sync" class="ghost small-btn hidden">↻ sync now</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="tb-global">
        <span class="brand" id="brand">scholar.</span>
        <div class="tabs">
          <button class="tab active">Calendar</button>
          <button class="tab muted" title="phase 4">Task List</button>
        </div>
        <span class="tb-spacer"></span>
        <div class="topbar-actions" id="topbar-actions">
          <div class="streak" id="streak" title="study streak"></div>
          <div class="cushion-chip" id="cushion-chip">cushion …</div>
          <button class="tb-pomo" id="btn-pomodoro" title="Pomodoro focus timer">🍅</button>
          <button class="primary" id="btn-add-task"><span class="ic">+</span><span class="lbl">task</span></button>
        </div>
      </div>
      <div class="tb-toolbar" id="tb-toolbar">
        <div class="viewtabs" id="viewtabs">
          <button data-view="day" class="day-tab-only-mobile">Day</button>
          <button data-view="twoDay">2 Day</button>
          <button data-view="week" class="active">Week</button>
          <button data-view="month">Month</button>
          <select id="view-n" title="next N days"><option value="">Next…</option>
            <option value="3">Next 3</option><option value="5">Next 5</option>
            <option value="7">Next 7</option></select>
        </div>
        <div class="weeknav">
          <button class="ghost" id="nav-today">today</button>
          <button class="ghost" id="nav-prev">‹</button>
          <button class="ghost" id="nav-next">›</button>
        </div>
        <span class="tb-spacer"></span>
        <span id="week-label" class="serif"></span>
      </div>
    </header>
    <div class="calendar" id="calendar"></div>
    <div class="analytics hidden" id="analytics"></div>
    <div class="courses-view hidden" id="courses"></div>
  </main>

  <button class="collapse-tab right" id="collapse-right" title="hide tasks">›</button>
    <aside class="panel" id="panel">
    <div class="panel-bar">
      <input id="task-search" placeholder="search tasks…" />
      <div class="panel-tools">
        <button id="btn-sort" class="ptool" title="sort tasks">⇅</button>
        <button id="btn-cushion" class="ptool" title="calculate cushion">◷</button>
      </div>
      <div id="sort-pop" class="ppop hidden">
        <div class="pp-sec">
          <label><input type="radio" name="sdir" value="asc" checked> Soonest first</label>
          <label><input type="radio" name="sdir" value="desc"> Latest first</label>
        </div>
        <div class="pp-sec pp-keys">
          <button data-sk="due" class="sk on">Due date</button>
          <button data-sk="estimate" class="sk">Total estimate</button>
          <button data-sk="need" class="sk">Time still needed</button>
          <button data-sk="plan" class="sk">Time left to plan</button>
          <button data-sk="priority" class="sk">Priority</button>
        </div>
      </div>
    </div>
    <div id="task-groups"></div>
  </aside>
</div>

<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js?v=1781603152"></script>
<script src="js/api.js?v=1781603152"></script>
<script src="js/calendar.js?v=1781603152"></script>
<script src="js/panel.js?v=1781603152"></script>
<script src="js/app.js?v=1781603152"></script>
</body>
</html>
